plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// ─────────────────────────────────────────────────────────────────────────────
//  署名設定の読み込み
//
//  優先順位:
//    1. GitHub Actions: -P オプションで渡された Gradle プロパティ
//    2. ローカル開発:   プロジェクトルートの keystore.properties ファイル
//
//  keystore.properties の形式（.gitignore に追加して絶対にコミットしないこと）:
//    storeFile=../your-release-key.jks
//    storePassword=your_store_password
//    keyAlias=your_key_alias
//    keyPassword=your_key_password
// ─────────────────────────────────────────────────────────────────────────────
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")

// CI 環境（GitHub Actions）では -P オプションで署名情報が渡される
def ciStoreFile     = findProperty('android.injected.signing.store.file')
def ciStorePassword = findProperty('android.injected.signing.store.password')
def ciKeyAlias      = findProperty('android.injected.signing.key.alias')
def ciKeyPassword   = findProperty('android.injected.signing.key.password')

// ローカル環境では keystore.properties を読み込む
def localSigningAvailable = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    localSigningAvailable = true
}

// versionName / versionCode を -P オプションで上書き可能にする
def buildVersionName = findProperty('versionName') ?: '1.0.0'
def buildVersionCode = (findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'com.deepsleep.alarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.deepsleep.alarm"
        minSdk 26
        targetSdk 34
        versionCode buildVersionCode
        versionName buildVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas")
            }
        }
    }

    // ─────────────────────────────────────────────
    //  署名設定
    // ─────────────────────────────────────────────
    signingConfigs {
        release {
            if (ciStoreFile) {
                // ① CI/CD（GitHub Actions）: -P オプションから読み込む
                storeFile     file(ciStoreFile)
                storePassword ciStorePassword
                keyAlias      ciKeyAlias
                keyPassword   ciKeyPassword
            } else if (localSigningAvailable) {
                // ② ローカル開発: keystore.properties から読み込む
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
            // ③ どちらも未設定の場合は debug 署名にフォールバック（後述）
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 署名設定が有効な場合のみ release signingConfig を使用
            if (ciStoreFile || localSigningAvailable) {
                signingConfig signingConfigs.release
            } else {
                // 署名情報なし（ローカルの動作確認目的のみ）
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    buildFeatures {
        viewBinding true    // View Binding を有効化
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // テスト設定
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // ---- Android Core & Lifecycle ----
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ---- Navigation Component ----
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // ---- Room Database（睡眠データ永続化） ----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ---- ExoPlayer（高品質な音楽ファイル再生） ----
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'

    // ---- WorkManager（定期的なデータ集計処理） ----
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // ---- グラフ表示（睡眠深度グラフ） ----
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ---- Coroutines ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ---- SharedPreferences の型安全ラッパー ----
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ---- テスト ----
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
