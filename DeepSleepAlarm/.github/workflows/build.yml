name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'           # v1.0.0 などのタグでリリースビルドを実行
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────
  #  ビルドジョブ
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② JDK 17 のセットアップ（Gradle 8.x は JDK 17 推奨）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ③ Gradle のキャッシュ設定
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ④ gradlew に実行権限を付与
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⑤ デバッグ APK をビルド
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ⑥ デバッグ APK をアーティファクトとしてアップロード
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ⑦ タグプッシュ時はリリース APK もビルド
      - name: Build Release APK (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE:       ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD:   ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:           ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:        ${{ secrets.KEY_PASSWORD }}
        run: |
          # キーストアを Base64 デコードして復元
          echo "$KEYSTORE_FILE" | base64 --decode > app/release.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # ⑧ リリース APK を GitHub Releases に自動公開
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  #  Lint チェックジョブ
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
